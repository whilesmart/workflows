name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate actions and workflows
        uses: mpalmer/action-validator@c994f427b7c42cd5ecb1bc9315cb91c3d7d72e3d
        with:
          version: '0.9.0'
          patterns: |
            go/release/action.yml
            .github/workflows/*.yml
            .github/workflows/*.yaml

  go-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the Go release action without publishing
        uses: ./go/release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 1.3.0-test
          verify_command: test "$RELEASE_TAG" = v1.3.0-test
          test_command: test "$RELEASE_VERSION" = 1.3.0-test
          build_command: mkdir -p dist && printf '%s\n' "$RELEASE_VERSION" > dist/workflow-test.txt
          release_notes_file: README.md
          publish: 'false'

      - name: Check the generated artifact and checksum
        run: |
          test "$(cat dist/workflow-test.txt)" = 1.3.0-test
          cd dist
          sha256sum -c checksums.txt
