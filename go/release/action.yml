name: 'Go Release'
description: 'Validate, build, and publish a tagged Go release'

inputs:
  token:
    description: 'GitHub token for authentication'
    required: true
  binary_name:
    description: 'Name of the output binary when using the built-in builder'
    required: false
    default: ''
  version:
    description: 'Version to release. When omitted, the version comes from the pushed tag'
    required: false
    default: ''
  build_path:
    description: 'Package to build with the built-in builder'
    required: false
    default: '.'
  go_version:
    description: 'Go version to use'
    required: false
    default: '1.21'
  platforms:
    description: 'Platforms to build with the built-in builder as a JSON array'
    required: false
    default: '["linux/amd64", "linux/arm64", "darwin/amd64", "darwin/arm64", "windows/amd64", "windows/arm64"]'
  ldflags:
    description: 'Additional linker flags for the built-in builder'
    required: false
    default: ''
  setup_command:
    description: 'Command to prepare project-specific release dependencies'
    required: false
    default: ''
  verify_command:
    description: 'Command that validates release metadata'
    required: false
    default: ''
  test_command:
    description: 'Command that must pass before artifacts or tags are published'
    required: false
    default: 'go build ./... && go vet ./... && go test -race -count=1 ./...'
  build_command:
    description: 'Command that replaces the built-in cross-platform builder'
    required: false
    default: ''
  release_branch:
    description: 'Branch that must contain the released commit'
    required: false
    default: ''
  release_notes_file:
    description: 'Release notes file. When omitted, notes come from the changelog'
    required: false
    default: ''
  assets:
    description: 'Newline-separated release asset patterns'
    required: false
    default: 'dist/*'
  generate_checksums:
    description: 'Generate checksums after the built-in or custom build'
    required: false
    default: 'true'
  publish:
    description: 'Create the tag and GitHub release after validation'
    required: false
    default: 'true'
  draft:
    description: 'Create the release as a draft'
    required: false
    default: 'false'

outputs:
  version:
    description: 'The version that was released'
    value: ${{ steps.version.outputs.version }}
  release_url:
    description: 'The published release URL'
    value: ${{ steps.release.outputs.url }}

runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ inputs.token }}

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go_version }}

    - name: Determine version
      id: version
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        if [ -n "$INPUT_VERSION" ]; then
          VERSION="${INPUT_VERSION#v}"
          SOURCE=input
        elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
          VERSION="${GITHUB_REF#refs/tags/v}"
          SOURCE=tag
        else
          echo '::error::Provide a version or run this action from a version tag.'
          exit 1
        fi

        if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+].+)?$'; then
          echo "::error::$VERSION is not a semantic version."
          exit 1
        fi

        {
          echo "version=$VERSION"
          echo "tag=v$VERSION"
          echo "source=$SOURCE"
        } >> "$GITHUB_OUTPUT"

    - name: Require the release branch
      if: inputs.release_branch != ''
      shell: bash
      env:
        RELEASE_BRANCH: ${{ inputs.release_branch }}
      run: |
        git fetch origin "$RELEASE_BRANCH"
        if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$RELEASE_BRANCH"; then
          echo "::error::$GITHUB_SHA is not contained in $RELEASE_BRANCH."
          exit 1
        fi

    - name: Set up release dependencies
      if: inputs.setup_command != ''
      shell: bash
      env:
        COMMAND: ${{ inputs.setup_command }}
        RELEASE_TAG: ${{ steps.version.outputs.tag }}
        RELEASE_VERSION: ${{ steps.version.outputs.version }}
      run: bash -euo pipefail -c "$COMMAND"

    - name: Validate release metadata
      if: inputs.verify_command != ''
      shell: bash
      env:
        COMMAND: ${{ inputs.verify_command }}
        RELEASE_TAG: ${{ steps.version.outputs.tag }}
        RELEASE_VERSION: ${{ steps.version.outputs.version }}
      run: bash -euo pipefail -c "$COMMAND"

    - name: Test release
      if: inputs.test_command != ''
      shell: bash
      env:
        COMMAND: ${{ inputs.test_command }}
        RELEASE_TAG: ${{ steps.version.outputs.tag }}
        RELEASE_VERSION: ${{ steps.version.outputs.version }}
      run: bash -euo pipefail -c "$COMMAND"

    - name: Build custom release artifacts
      if: inputs.build_command != ''
      shell: bash
      env:
        COMMAND: ${{ inputs.build_command }}
        RELEASE_TAG: ${{ steps.version.outputs.tag }}
        RELEASE_VERSION: ${{ steps.version.outputs.version }}
      run: bash -euo pipefail -c "$COMMAND"

    - name: Build release artifacts
      if: inputs.build_command == ''
      shell: bash
      env:
        BINARY_NAME: ${{ inputs.binary_name }}
        BUILD_PATH: ${{ inputs.build_path }}
        EXTRA_LDFLAGS: ${{ inputs.ldflags }}
        PLATFORMS: ${{ inputs.platforms }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        if [ -z "$BINARY_NAME" ]; then
          echo '::error::binary_name is required when build_command is empty.'
          exit 1
        fi

        BUILD_TIME="$(date -u '+%Y-%m-%d_%H:%M:%S')"
        GIT_COMMIT="$(git rev-parse --short HEAD)"
        LDFLAGS="-s -w -X main.Version=$VERSION -X main.BuildTime=$BUILD_TIME -X main.GitCommit=$GIT_COMMIT"
        if [ -n "$EXTRA_LDFLAGS" ]; then
          LDFLAGS="$LDFLAGS $EXTRA_LDFLAGS"
        fi

        mkdir -p dist
        echo "$PLATFORMS" | jq -r '.[]' | while read -r platform; do
          GOOS="${platform%/*}"
          GOARCH="${platform#*/}"
          NAME="${BINARY_NAME}-${VERSION}-${GOOS}-${GOARCH}"
          if [ "$GOOS" = windows ]; then
            NAME="$NAME.exe"
          fi
          CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags "$LDFLAGS" -o "dist/$NAME" "$BUILD_PATH"
        done

        (
          cd dist
          for FILE in *; do
            if [[ "$FILE" == *.exe ]]; then
              zip "${FILE%.exe}.zip" "$FILE"
              rm "$FILE"
            else
              tar -czf "$FILE.tar.gz" "$FILE"
              rm "$FILE"
            fi
          done
        )

    - name: Generate checksums
      if: inputs.generate_checksums == 'true'
      shell: bash
      run: |
        cd dist
        sha256sum ./* > checksums.txt
        sha256sum -c checksums.txt

    - name: Prepare release notes
      id: notes
      shell: bash
      env:
        RELEASE_NOTES_FILE: ${{ inputs.release_notes_file }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        NOTES="$RUNNER_TEMP/go-release-notes.md"
        if [ -n "$RELEASE_NOTES_FILE" ]; then
          if [ ! -s "$RELEASE_NOTES_FILE" ]; then
            echo "::error::Release notes are missing: $RELEASE_NOTES_FILE"
            exit 1
          fi
          cp "$RELEASE_NOTES_FILE" "$NOTES"
        elif [ -f CHANGELOG.md ]; then
          awk -v version="$VERSION" '
            /^## / {
              if (printing) exit
              if (index($0, "[" version "]") || index($0, " " version " ") || $2 == version) { printing=1; next }
            }
            printing { print }
          ' CHANGELOG.md > "$NOTES"
          if [ ! -s "$NOTES" ]; then
            echo "::error::CHANGELOG.md has no release notes for $VERSION."
            exit 1
          fi
        else
          echo "Release $VERSION" > "$NOTES"
        fi
        echo "path=$NOTES" >> "$GITHUB_OUTPUT"

    - name: Create tag
      if: inputs.publish == 'true' && steps.version.outputs.source == 'input'
      shell: bash
      env:
        TAG: ${{ steps.version.outputs.tag }}
      run: |
        if git rev-parse "$TAG" >/dev/null 2>&1; then
          echo "::error::$TAG already exists."
          exit 1
        fi
        git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git config --local user.name 'github-actions[bot]'
        git tag -a "$TAG" -m "Release $TAG"
        git push origin "$TAG"

    - name: Publish GitHub release
      if: inputs.publish == 'true'
      id: release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: ${{ steps.version.outputs.tag }}
        body_path: ${{ steps.notes.outputs.path }}
        draft: ${{ inputs.draft }}
        prerelease: ${{ contains(steps.version.outputs.version, '-') }}
        files: ${{ inputs.assets }}
        token: ${{ inputs.token }}
